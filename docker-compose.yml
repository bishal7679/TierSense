services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend
    ports:
      - "8000:8000"
    privileged: true
    volumes:
      - /mnt/nfs_logs:/app/logs
      - .env:/app/.env             # Mount root .env into container
    env_file:
      - .env                       # Optional: also inject as ENV vars
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: production