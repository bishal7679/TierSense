version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend
    ports:
      - "8000:8000"
    
    # These security settings are required for the container to control the host's auditd service.
    privileged: true
    security_opt:
      - "apparmor=unconfined"
      
    volumes:
      # Mounts the host's filesystem so the container can see the files to monitor.
      - /:/host-root:ro
      
      # Mounts the host's audit logs so Filebeat inside the container can read them.
      - /var/log/audit:/var/log/audit:ro
      
      # This line is for the original NFS functionality (optional)
      - ${NFS_MOUNT_DIR}:/mnt/nfs:ro
      
      # Persistent volume for storing processed logs and heatmaps.
      - logs:/app/logs
      
      # Backend-specific environment configuration
      - ./backend/.env:/app/.env:ro
      
    env_file:
      - .env
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Frontend connects to backend
    depends_on:
      - backend

volumes:
  logs: