version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend

    ports:
      - "8000:8000"
    privileged: true  # Needed for auditd + filebeat access inside container

    volumes:
      - ${NFS_MOUNT_DIR}:/mnt/nfs                 # NFS mount from host VM1 (specified in .env)
      - tiersense_logs:/apps/logs                # Persistent logs from analysis
      - ./backend/.env:/app/.env:ro              # Backend-specific env

    env_file:
      - .env
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend

    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local

    environment:
      - NEXT_PUBLIC_API_URL=http://10.14.220.29:8000  # Replace with your backend IP

    depends_on:
      - backend

volumes:
  tiersense_logs: