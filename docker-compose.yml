version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend
    ports:
      - "8000:8000"

    privileged: true
    pid: "host"
    security_opt:
      - "apparmor=unconfined"

    volumes:
      # Mount full host root for analysis (read-only)
      - /:/host-root:ro
      # Mount auditd logs for Filebeat inside container
      - /var/log/audit:/var/log/audit:ro
      # Mount NFS directory (user-provided in .env)
      - ${NFS_MOUNT_DIR}:/mnt/nfs:ro
      # Persistent volume for logs and heatmap
      - logs:/app/logs
      # Read-only backend environment config
      - ./backend/.env:/app/.env:ro
      #bind-mount the host-side helper  
      - /usr/local/bin/tiersense_audit_config.sh:/usr/local/bin/tiersense_audit_config.sh:ro
      # Bind mount auditctl for audit configuration
      - /usr/sbin/auditctl:/usr/sbin/auditctl:ro

      - /var/log/audit:/var/log/audit:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    env_file:
      - .env
      - ./backend/.env

    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  logs: