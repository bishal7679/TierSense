version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend
    ports:
      - "8000:8000"
    privileged: true           # Needed for mount, audit log access
    volumes:
      - ${NFS_MOUNT_DIR}:/mnt/nfs              # Dynamically mount NFS from .env
      - ./logs:/app/logs                       # Persist analysis results
      - ./backend/.env:/app/.env:ro            # Backend-specific env
    env_file:
      - .env
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: production
