version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend
    ports:
      - "8000:8000"
    privileged: true # Required for auditd/filebeat
    volumes:
      # This line mounts the host's entire filesystem into /host-root (read-only)
      # It allows you to monitor any local directory (e.g., /host-root/home/user/logs)
      - /:/host-root:ro
      
      # This line is for the original NFS functionality
      - ${NFS_MOUNT_DIR}:/mnt/nfs:ro
      
      # Persistent volume for analysis results and logs
      - logs:/app/logs
      
      # Backend-specific environment configuration
      - ./backend/.env:/app/.env:ro
    env_file:
      - .env
      - ./backend/.env
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000 # Frontend connects to backend
    depends_on:
      - backend

volumes:
  logs: