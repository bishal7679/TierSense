version: '3.9'

services:

  backend:
    build:
      context: .                         # Set context to root to access .env
      dockerfile: backend/Dockerfile    # Specify the actual Dockerfile
    container_name: tiersense-backend
    ports:
      - "8000:8000"
    privileged: true
    volumes:
      - /mnt/nfs_logs:/app/logs          # NFS-mounted host directory
    env_file:
      - .env                             # Loads environment variables at runtime
    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NODE_ENV: production