version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: tiersense-backend

    ports:
      - "8000:8000"
    privileged: true  # Required for auditd/filebeat

    volumes:
      - ${NFS_MOUNT_DIR}:/mnt/nfs:ro            # NFS mount read-only
      - logs:/app/logs                          # Persistent logs from analysis
      - ./backend/.env:/app/.env:ro             # Backend-specific config

    env_file:
      - .env
      - ./backend/.env

    environment:
      PYTHONUNBUFFERED: "1"

  frontend:
    build:
      context: ./frontend
    container_name: tiersense-frontend

    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local

    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000  # Frontend connects to backend

    depends_on:
      - backend

volumes:
  logs: