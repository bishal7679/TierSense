filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/audit/audit.log
    processors:
      - decode_json_fields:
          fields: ["message"]
          target: ""
    multiline.pattern: '^{'
    multiline.negate: true
    multiline.match: after

output.file:
  path: "/nfs/logs/"
  filename: "access-tiering.ndjson"
  codec:
    format:
      string: '{"@timestamp":"%{+yyyy-MM-dd''T''HH:mm:ss}","message":"%{[message]}"}'